<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worryless Logistics — 官网设计初稿三方向对比</title>
<style>
  :root {
    --bg: #0e1015;
    --panel: #161922;
    --border: rgba(255, 255, 255, 0.1);
    --gold: #d4af37;
    --gold-soft: rgba(212, 175, 55, 0.14);
    --text: #f3f4f6;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand img {
    width: 34px;
    height: 34px;
    object-fit: contain;
    background: #fff;
    border-radius: 6px;
    padding: 2px;
  }
  .brand-title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--muted);
  }
  .tabs {
    display: flex;
    gap: 6px;
    background: rgba(0, 0, 0, 0.4);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .tab {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    padding: 6px 18px;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    letter-spacing: 0.05em;
  }
  .tab:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
  }
  .tab.active {
    background: var(--gold-soft);
    color: #fff;
    border-color: rgba(212, 175, 55, 0.6);
    box-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
  }
  .badge {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--gold);
    font-weight: 600;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vp-btn, .open-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 7px;
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.18s ease;
  }
  .vp-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: var(--gold-soft);
  }
  .open-btn {
    background: var(--gold);
    color: #111;
    border-color: var(--gold);
    font-weight: 600;
  }
  .open-btn:hover { filter: brightness(1.08); }
  .info-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 20px;
    background: #12151d;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    gap: 16px;
    flex-shrink: 0;
  }
  .info-bar strong { color: var(--text); }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #090b0f;
    overflow: hidden;
    position: relative;
  }
  .frame-wrap {
    width: 100%;
    height: 100%;
    transition: width 0.25s ease, height 0.25s ease;
    background: #fff;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  }
  .frame-wrap.mobile {
    width: 390px;
    height: calc(100% - 24px);
    border-radius: 20px;
    overflow: hidden;
    border: 6px solid #262b38;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="assets/logo.jpg" alt="Worryless Logistics Logo">
      <div>
        <div class="brand-title">Shenzhen Worryless International Logistics — 官网设计方案预览</div>
        <div class="brand-sub">点击上方 A / B / C 切换设计方案 · 支持桌面端 / 手机端切换</div>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-src="direction-a-black-gold.html" data-desc="方案 A">
        A
      </button>
      <button class="tab" data-src="direction-b-corporate.html" data-desc="方案 B">
        B
      </button>
      <button class="tab" data-src="direction-c-route-map.html" data-desc="方案 C">
        C
      </button>
    </div>

    <div class="actions">
      <button class="vp-btn active" id="btnDesktop">桌面端 (Desktop)</button>
      <button class="vp-btn" id="btnMobile">手机端 (390px)</button>
      <a class="open-btn" id="openNew" href="direction-a-black-gold.html" target="_blank" rel="noopener">单独全屏打开 ↗</a>
    </div>
  </header>

  <div class="info-bar">
    <div id="descText"><strong>当前预览：</strong>方案 A</div>
    <div>主推业务：<strong>China to USA Air Freight DDP</strong> &amp; <strong>Sea Freight DDP</strong> · Banner 比例 1920×750</div>
  </div>

  <main>
    <div class="frame-wrap" id="frameWrap">
      <iframe id="previewFrame" src="direction-a-black-gold.html" title="Website Draft Preview"></iframe>
    </div>
  </main>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const frame = document.getElementById('previewFrame');
    const openNew = document.getElementById('openNew');
    const descText = document.getElementById('descText');
    const frameWrap = document.getElementById('frameWrap');
    const btnDesktop = document.getElementById('btnDesktop');
    const btnMobile = document.getElementById('btnMobile');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const src = tab.getAttribute('data-src');
        const desc = tab.getAttribute('data-desc');
        frame.src = src;
        openNew.href = src;
        descText.innerHTML = '<strong>当前预览：</strong>' + desc;
      });
    });

    btnDesktop.addEventListener('click', () => {
      btnDesktop.classList.add('active');
      btnMobile.classList.remove('active');
      frameWrap.classList.remove('mobile');
    });

    btnMobile.addEventListener('click', () => {
      btnMobile.classList.add('active');
      btnDesktop.classList.remove('active');
      frameWrap.classList.add('mobile');
    });
  </script>
</body>
</html>
